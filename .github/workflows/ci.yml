name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n run.sh
      - run: cargo build --locked
      - name: Check CPU stability graph, statistics and JSON
        run: |
          fixture_dir="$(mktemp -d)"
          cat > "$fixture_dir/sysbench" <<'SH'
          #!/bin/sh
          set -eu
          if [ "$1" = --version ]; then
            printf 'sysbench 1.0.20\n'
            exit 0
          fi
          test "$*" = '--time=300 --threads=1 --report-interval=1 --cpu-max-prime=20000 cpu run'
          for second in $(seq 1 299); do
            if [ "$second" -le 60 ]; then rate=1200
            elif [ "$second" -le 240 ]; then rate=1000
            else rate=800
            fi
            printf '[ %ss ] thds: 1 eps: %s.00 lat (ms,95%%): 0.50\n' "$second" "$rate"
            if [ "$second" = 1 ] || [ "$second" = 241 ]; then sleep 0.2; fi
          done
          printf 'CPU speed:\n    events per second: 1000.00\n'
          SH
          chmod +x "$fixture_dir/sysbench"
          PATH="$fixture_dir:$PATH" TERM=xterm-256color script -qefc 'stty cols 100 && target/debug/vps-bench run --only stability --threads 1 --output /tmp/vps-bench-stability.json' /tmp/vps-bench-stability-terminal.log < /dev/null
          grep -qF 'График ·' /tmp/vps-bench-stability-terminal.log
          grep -Eq 'Первая → последняя минута.*1200.00.*800.00.*-33.33%' /tmp/vps-bench-stability-terminal.log
          jq -e '.measurements | length == 1 and all(.[]; .test == "cpu_stability" and .status == "completed" and .parameters.seconds == 300 and (.cpu_series.samples | length == 299) and .cpu_series.first_minute_samples == 60 and .cpu_series.last_minute_samples == 59 and any(.metrics[]; .kind == "events_per_second_p10" and .value == 800))' /tmp/vps-bench-stability.json
          target/debug/vps-bench --color never compare /tmp/vps-bench-stability.json /tmp/vps-bench-stability.json > /tmp/vps-bench-stability-compare.log
          grep -qF 'Близко +0.00%' /tmp/vps-bench-stability-compare.log
      - name: Check Crypto stages and comparison
        run: |
          openssl version
          TERM=xterm-256color script -qefc 'stty cols 100 && target/debug/vps-bench run --only crypto --seconds 3 --output /tmp/vps-bench-crypto.json' /tmp/vps-bench-crypto-terminal.log < /dev/null
          grep -Eq '(Плохо|Норма|Хорошо).*МиБ/с · интервал [12]/3' /tmp/vps-bench-crypto-terminal.log
          test "$(grep -c 'Итог.*МиБ/с' /tmp/vps-bench-crypto-terminal.log)" -eq 2
          jq -e '(.tools.openssl | length > 0) and (.measurements | map(.test) == ["crypto_sha256", "crypto_aes256_gcm"] and all(.[]; .status == "completed" and .parameters.block_kib == 16 and .parameters.sample_seconds == 1 and any(.metrics[]; .kind == "mib_per_second" and .value > 0)))' /tmp/vps-bench-crypto.json
          target/debug/vps-bench --color never compare /tmp/vps-bench-crypto.json /tmp/vps-bench-crypto.json > /tmp/vps-bench-crypto-compare.log
          test "$(grep -c 'Близко +0.00%' /tmp/vps-bench-crypto-compare.log)" -eq 2
      - name: Install CPU and network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sysbench iputils-ping iperf3
      - name: Check scheduler wakeup latency under CPU load
        run: |
          TERM=xterm-256color script -qefc 'stty cols 100 && target/debug/vps-bench run --only wakeup --seconds 3 --threads 2 --output /tmp/vps-bench-wakeup.json' /tmp/vps-bench-wakeup-terminal.log < /dev/null
          grep -qF 'Ожидание нагрузки sysbench' /tmp/vps-bench-wakeup-terminal.log
          grep -Eq '(Плохо|Норма|Хорошо).*последний .* мкс · замеров' /tmp/vps-bench-wakeup-terminal.log
          test "$(grep -c 'Итог.*пробуждение p99' /tmp/vps-bench-wakeup-terminal.log)" -eq 2
          test "$(grep -c 'Итог.*максимум' /tmp/vps-bench-wakeup-terminal.log)" -eq 2
          jq -e '
            .measurements |
            map(.test) == ["wakeup_idle", "wakeup_cpu_load"] and
            .[1].parameters.load == {threads: 2, cpu_max_prime: 20000} and
            all(.[]; .status == "completed" and .parameters.seconds == 3 and
              .parameters.interval_us == 1000 and
              (.metrics | map({key: .kind, value: .value}) | from_entries |
                .wakeup_p99_us >= 0 and .wakeup_max_us >= .wakeup_p99_us and
                .wakeup_samples > 0 and .wakeup_missed_intervals >= 0 and
                .wakeup_samples + .wakeup_missed_intervals == 3000))
          ' /tmp/vps-bench-wakeup.json
          target/debug/vps-bench --color never compare /tmp/vps-bench-wakeup.json /tmp/vps-bench-wakeup.json > /tmp/vps-bench-wakeup-compare.log
          test "$(grep -c 'Близко +0.00%' /tmp/vps-bench-wakeup-compare.log)" -eq 4
      - name: Check ICMP and TCP load on loopback
        run: |
          iperf3 -s -B 127.0.0.1 -p 35201 > /tmp/vps-bench-iperf.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 0.2
          TERM=xterm-256color script -qefc 'stty cols 100 && target/debug/vps-bench run --only latency --ping-target 127.0.0.1 --ping-count 6 --iperf-host 127.0.0.1 --iperf-port 35201 --output /tmp/vps-bench.json' /tmp/vps-bench-terminal.log
          grep -Eq '(Плохо|Норма|Хорошо).*RTT [0-9.]+ мс · ответов [1-6]/6' /tmp/vps-bench-terminal.log
          grep -Eq 'Итог.*(Плохо|Норма|Хорошо).*RTT p95' /tmp/vps-bench-terminal.log
          grep -Eq 'Итог.*(Плохо|Норма|Хорошо).*потери [0-9.]+' /tmp/vps-bench-terminal.log
          grep -qF 'Сеть · Задержка и потери ICMP' /tmp/vps-bench-terminal.log
          grep -qF '≤100 / ≤30' /tmp/vps-bench-terminal.log
          grep -qF 'RTT p95, мс · Δ = нагрузка − простой' /tmp/vps-bench-terminal.log
          jq -e '.measurements | length == 3 and all(.[]; .status == "completed" and (.workload | startswith("ping")) and any(.metrics[]; .kind == "rtt_p99_ms"))' /tmp/vps-bench.json
          jq -e '[.measurements[].rtt_p95_load | select(. != null)] | length == 2 and all(.[]; (.delta_ms | type) == "number" and ((.delta_ms - .loaded_ms + .idle_ms) | fabs) < 0.000001)' /tmp/vps-bench.json
          target/debug/vps-bench --color never compare /tmp/vps-bench.json /tmp/vps-bench.json > /tmp/vps-bench-rtt-compare.log
          grep -qF 'Δ B − Δ A' /tmp/vps-bench-rtt-compare.log
