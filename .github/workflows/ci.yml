name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n run.sh
      - name: Check ICMP and TCP load on loopback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iputils-ping iperf3
          cargo build --locked
          iperf3 -s -B 127.0.0.1 -p 35201 > /tmp/vps-bench-iperf.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 0.2
          TERM=xterm-256color script -qefc 'stty cols 100 && target/debug/vps-bench run --only latency --ping-target 127.0.0.1 --ping-count 6 --iperf-host 127.0.0.1 --iperf-port 35201 --output /tmp/vps-bench.json' /tmp/vps-bench-terminal.log
          grep -Eq 'ответов [1-6]/6' /tmp/vps-bench-terminal.log
          grep -qF 'Сеть · Задержка и потери ICMP' /tmp/vps-bench-terminal.log
          grep -qF '≤100 / ≤30' /tmp/vps-bench-terminal.log
          jq -e '.measurements | length == 3 and all(.[]; .status == "completed" and (.workload | startswith("ping")) and any(.metrics[]; .kind == "rtt_p99_ms"))' /tmp/vps-bench.json
