[package]
name = "vps-bench"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Repeatable CPU, memory, disk and network benchmarks for Linux VPS"
license = "MIT"
repository = "https://github.com/xDilettante/vps-bench"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
